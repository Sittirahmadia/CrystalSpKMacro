name: Build noqwdmacro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone ImGui (Docking branch)
      run: |
        git clone --depth 1 --branch docking https://github.com/ocornut/imgui.git deps/imgui

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: noqwdmacro-${{ matrix.build_type }}-x64
        path: build/bin/${{ matrix.build_type }}/noqwdmacro.exe
        if-no-files-found: warn
