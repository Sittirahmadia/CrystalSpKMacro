name: Build CrystalSpKMacro

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download nlohmann/json
        run: |
          mkdir -p vendor/nlohmann
          curl -sL "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" -o vendor/nlohmann/json.hpp

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalSpKMacro-native
          path: build/Release/CrystalSpKMacro.exe
          if-no-files-found: error
